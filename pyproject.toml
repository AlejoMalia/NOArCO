[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noarco"
dynamic = ["version"]
description = "NOArCO: analytical framework for terraforming, paraterraforming and planetary-engineering assessment"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "CC-BY-4.0" }
authors = [
    { name = "Alejo Malia" },
    { name = "NOArCO Contributors" },
]
keywords = ["terraforming", "planetary-science", "climate", "optimization", "mars"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pydantic>=2.6",
    "astropy>=6.0",
    "xarray>=2024.1",
    "networkx>=3.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
optim = ["pyomo>=6.7", "pymoo>=0.6"]
sfsa = ["sfsa"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.8", "ruff>=0.3"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[tool.setuptools.dynamic]
version = { attr = "noarco.__version__" }

[tool.setuptools.packages.find]
include = ["noarco*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["scipy.*", "networkx.*", "sfsa.*"]
ignore_missing_imports = true
